blueprint:
  name: EV Charger KR - 구역별 충전 가능 대수 알림
  description: >-
    지정한 사용자(person)가 설정된 구역(최대 3개) 중 한 곳에 진입하면,
    해당 구역에 매핑된 1개 이상의 전기차 충전소 센서에서 현재 충전 가능 대수를
    모바일 앱 알림으로 전송합니다. 자동화 화면에서 '실행'을 누르면 설정된 모든 구역의
    테스트 알림을 즉시 발송합니다.
  domain: automation
  source_url: https://github.com/helico717/ha-ev-charger-kr/blob/main/blueprints/automation/ev_charger_kr/zone_arrival_charger_notify.yaml
  input:
    person_entity:
      name: 추적할 사용자
      description: 구역 진입 여부를 감지할 Person 엔티티를 선택하세요.
      selector:
        entity:
          filter:
            - domain: person
    notify_device:
      name: 알림을 받을 모바일 기기
      description: Home Assistant Companion 앱이 설치된 모바일 기기를 선택하세요.
      selector:
        device:
          filter:
            - integration: mobile_app
    zone_1_group:
      name: 구역 1 설정 (필수)
      icon: mdi:map-marker
      input:
        zone_1:
          name: 구역 1
          description: 첫 번째 감지 구역을 선택하세요.
          selector:
            entity:
              filter:
                - domain: zone
        zone_1_sensors:
          name: 구역 1 충전 가능 대수 센서 (1개 이상)
          description: 구역 1 도착 시 알림을 받을 '충전 가능 대수' 센서를 선택하세요.
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  integration: ev_charger_kr
    zone_2_group:
      name: 구역 2 설정 (선택)
      icon: mdi:map-marker-plus
      collapsed: true
      input:
        zone_2:
          name: 구역 2
          description: 두 번째 감지 구역이 있다면 선택하세요.
          default: ""
          selector:
            entity:
              filter:
                - domain: zone
        zone_2_sensors:
          name: 구역 2 충전 가능 대수 센서
          description: 구역 2 도착 시 알림을 받을 '충전 가능 대수' 센서를 선택하세요.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  integration: ev_charger_kr
    zone_3_group:
      name: 구역 3 설정 (선택)
      icon: mdi:map-marker-plus
      collapsed: true
      input:
        zone_3:
          name: 구역 3
          description: 세 번째 감지 구역이 있다면 선택하세요.
          default: ""
          selector:
            entity:
              filter:
                - domain: zone
        zone_3_sensors:
          name: 구역 3 충전 가능 대수 센서
          description: 구역 3 도착 시 알림을 받을 '충전 가능 대수' 센서를 선택하세요.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  integration: ev_charger_kr
    notification_title:
      name: 알림 제목 (비워두면 구역명·총 가능 대수 자동 표시)
      description: "예: 비워두면 '[학교 도착] 충전 가능 7대' 형태로 자동 표시됩니다."
      default: ""
      selector:
        text:
    refresh_before_notify:
      name: 알림 전 최신 상태 즉시 갱신
      description: 구역에 진입한 직후 API에서 최신 충전기 상태를 1회 새로 조회한 뒤 알림을 보냅니다.
      default: true
      selector:
        boolean:
    only_when_available:
      name: 충전 가능 대수가 1대 이상일 때만 알림
      description: 해당 구역에 매핑된 모든 충전소가 만차(0대)일 때는 알림을 보내지 않습니다.
      default: false
      selector:
        boolean:

variables:
  zone_1_input: !input zone_1
  zone_1_sensors_input: !input zone_1_sensors
  zone_2_input: !input zone_2
  zone_2_sensors_input: !input zone_2_sensors
  zone_3_input: !input zone_3
  zone_3_sensors_input: !input zone_3_sensors
  notification_title_input: !input notification_title
  refresh_before_notify_input: !input refresh_before_notify
  only_when_available_input: !input only_when_available

triggers:
  - trigger: state
    entity_id: !input person_entity

conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none and
         (trigger.from_state is none or trigger.from_state.state != trigger.to_state.state) }}

actions:
  - variables:
      z1_name: "{{ state_attr(zone_1_input, 'friendly_name') if zone_1_input else '' }}"
      z2_name: "{{ state_attr(zone_2_input, 'friendly_name') if zone_2_input else '' }}"
      z3_name: "{{ state_attr(zone_3_input, 'friendly_name') if zone_3_input else '' }}"
      target_batches: >-
        {% set ns = namespace(batches=[]) %}
        {% if trigger is defined and trigger.to_state is defined %}
          {% set entered = trigger.to_state.state %}
          {% if z1_name and entered == z1_name and zone_1_sensors_input | length > 0 %}
            {% set ns.batches = ns.batches + [{'zone': z1_name, 'sensors': zone_1_sensors_input}] %}
          {% elif z2_name and entered == z2_name and zone_2_sensors_input | length > 0 %}
            {% set ns.batches = ns.batches + [{'zone': z2_name, 'sensors': zone_2_sensors_input}] %}
          {% elif z3_name and entered == z3_name and zone_3_sensors_input | length > 0 %}
            {% set ns.batches = ns.batches + [{'zone': z3_name, 'sensors': zone_3_sensors_input}] %}
          {% endif %}
        {% else %}
          {% if z1_name and zone_1_sensors_input | length > 0 %}
            {% set ns.batches = ns.batches + [{'zone': z1_name, 'sensors': zone_1_sensors_input}] %}
          {% endif %}
          {% if z2_name and zone_2_sensors_input | length > 0 %}
            {% set ns.batches = ns.batches + [{'zone': z2_name, 'sensors': zone_2_sensors_input}] %}
          {% endif %}
          {% if z3_name and zone_3_sensors_input | length > 0 %}
            {% set ns.batches = ns.batches + [{'zone': z3_name, 'sensors': zone_3_sensors_input}] %}
          {% endif %}
        {% endif %}
        {{ ns.batches }}
  - repeat:
      for_each: "{{ target_batches }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ refresh_before_notify_input }}"
          then:
            - action: homeassistant.update_entity
              target:
                entity_id: "{{ repeat.item.sensors }}"
            - delay:
                seconds: 2
        - if:
            - condition: template
              value_template: >-
                {% if not only_when_available_input %}
                  true
                {% else %}
                  {% set ns = namespace(has_avail=false) %}
                  {% for entity_id in repeat.item.sensors %}
                    {% if states(entity_id) | int(0) > 0 %}
                      {% set ns.has_avail = true %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.has_avail }}
                {% endif %}
          then:
            - domain: mobile_app
              type: notify
              device_id: !input notify_device
              title: >-
                {% set custom_title = notification_title_input | default('', true) | trim %}
                {% if custom_title %}
                  {{ custom_title }}
                {% else %}
                  {% set ns = namespace(total_avail=0) %}
                  {% for entity_id in repeat.item.sensors %}
                    {% set ns.total_avail = ns.total_avail + (states(entity_id) | int(0)) %}
                  {% endfor %}
                  {% if ns.total_avail > 0 %}
                    [{{ repeat.item.zone }} 도착] 충전 가능 {{ ns.total_avail }}대
                  {% else %}
                    [{{ repeat.item.zone }} 도착] 충전 가능 없음
                  {% endif %}
                {% endif %}
              message: >-
                {% set ns = namespace(lines=[]) %}
                {% for entity_id in repeat.item.sensors %}
                  {% set name = state_attr(entity_id, 'station_name') or state_attr(entity_id, 'friendly_name') or entity_id %}
                  {% set avail = states(entity_id) | int(0) %}
                  {% set total = state_attr(entity_id, 'total_chargers') %}
                  {% set fast = state_attr(entity_id, 'fast_available_chargers') | int(0) %}
                  {% set slow = state_attr(entity_id, 'slow_available_chargers') | int(0) %}
                  {% set count_str = (avail ~ '/' ~ total ~ '대') if total is not none else (avail ~ '대') %}
                  {% if fast > 0 and slow > 0 %}
                    {% set type_str = ' (급속 ' ~ fast ~ '·완속 ' ~ slow ~ ')' %}
                  {% elif fast > 0 %}
                    {% set type_str = ' (급속)' %}
                  {% elif slow > 0 %}
                    {% set type_str = ' (완속)' %}
                  {% else %}
                    {% set type_str = '' %}
                  {% endif %}
                  {% set ns.lines = ns.lines + [count_str ~ ' · ' ~ name ~ type_str] %}
                {% endfor %}
                {{ ns.lines | join('\n') }}

mode: single
max_exceeded: silent
